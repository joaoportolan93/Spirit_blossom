[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py tests_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short -q --cov=core --cov-report=term-missing --cov-fail-under=95

[pytest:django]
django_settings_module = config.settings_test

