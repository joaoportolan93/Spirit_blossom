# Ruff — linter e formatter para o backend Django
# https://docs.astral.sh/ruff/

line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "W", "RUF", "PIE"]
ignore = [
    # Django migrations usam listas como atributos de classe (dependencies, operations).
    # É o padrão do framework — não é um bug.
    "RUF012",
    # Blind except em health check e AccessLog logging é intencional
    # (falhas silenciosas para não derrubar o request).
    "BLE001",
]

[lint.per-file-ignores]
# Migrations: geradas pelo Django, não editamos manualmente
"*/migrations/*.py" = ["RUF012", "E501"]
# Settings: from config.settings import * é intencional no settings_ci
"config/settings_ci.py" = ["F401", "F403", "E402", "F405"]
# Testes: variáveis locais sem uso são normais em testes de efeito colateral; patch_sqlite precisa rodar antes
"tests/*.py" = ["F841", "E402", "E501"]

[format]
quote-style = "double"
indent-style = "space"

