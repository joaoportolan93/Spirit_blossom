name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Permissões mínimas
permissions:
  contents: read

jobs:
  # ─── Backend ───────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_db_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('apps/backend/requirements.txt') }}

      - name: Instalar dependências
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Ruff lint
        working-directory: apps/backend
        run: ruff check .

      - name: Ruff format check
        working-directory: apps/backend
        run: ruff format --check .

      - name: Migrations apply
        working-directory: apps/backend
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod-minimum-32-bytes!
          DJANGO_SETTINGS_MODULE: config.settings
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: app_db_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          ACCESS_LOG_HMAC_KEY: ci-hmac-key-32bytes-not-for-prod!
        run: |
          python manage.py migrate
          python manage.py makemigrations --check

      - name: Testes
        working-directory: apps/backend
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod-minimum-32-bytes!
          DJANGO_SETTINGS_MODULE: config.settings_ci
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: app_db_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          ACCESS_LOG_HMAC_KEY: ci-hmac-key-32bytes-not-for-prod!
        run: python -m pytest -v --tb=short

  # ─── Frontend ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependências
        working-directory: apps/frontend
        run: npm ci

      - name: ESLint
        working-directory: apps/frontend
        run: npm run lint

      - name: Vitest (11 testes)
        working-directory: apps/frontend
        run: npm test

      - name: Build
        working-directory: apps/frontend
        env:
          VITE_APP_NAME: SpiritBlossom
        run: npm run build

  # ─── Feed service (Rust) ───────────────────────────────────────────────
  feed:
    name: Feed Service (Rust)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/feed/target
          key: cargo-${{ hashFiles('services/feed/Cargo.lock') }}

      - name: cargo fmt check
        working-directory: services/feed
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: services/feed
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: services/feed
        run: cargo test

      - name: cargo build (release)
        working-directory: services/feed
        run: cargo build --release

  # ─── Docker Compose Smoke Test ─────────────────────────────────────────
  smoke-docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          cp .env.example .env
          echo "SECRET_KEY=smoke-secret-key-at-least-32-chars-long!" >> .env
          echo "ACCESS_LOG_HMAC_KEY=smoke-hmac-key-at-least-32-chars-long!" >> .env
          echo "POSTGRES_PASSWORD=smoke_pass" >> .env
          echo "REDIS_PASSWORD=smoke_redis" >> .env
          echo "APP_NAME=SpiritBlossom" >> .env
          echo "VITE_APP_NAME=SpiritBlossom" >> .env

      - name: Build and Start Stack
        run: |
          docker compose -f infra/docker-compose.yml build
          docker compose -f infra/docker-compose.yml up -d

      - name: Wait for /api/health/
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8000/api/health/; do sleep 2; done'

      - name: Teardown
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  # ─── ARM64 Backend Build Check ─────────────────────────────────────────
  arm64-build:
    name: Backend ARM64 Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: false

  # ─── E2E (job separado, roda em push para main) ────────────────────────
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Subir stack
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-e2e-secret-key-32bytes-secret!!" >> .env
          echo "ACCESS_LOG_HMAC_KEY=ci-e2e-hmac-32bytes-secret-key!" >> .env
          echo "POSTGRES_PASSWORD=e2e_pass" >> .env
          echo "REDIS_PASSWORD=e2e_redis" >> .env
          echo "APP_NAME=SpiritBlossom" >> .env
          echo "VITE_APP_NAME=SpiritBlossom" >> .env
          docker compose -f infra/docker-compose.yml up -d --wait

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependências e Playwright
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Rodar E2E
        working-directory: apps/frontend
        run: npx playwright test

      - name: Parar stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
