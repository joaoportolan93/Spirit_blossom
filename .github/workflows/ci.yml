name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Permissões mínimas
permissions:
  contents: read

jobs:
  # ─── Backend ───────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.commits[0].modified, 'apps/backend') ||
      github.event_name == 'push'

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: app_db_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_user -d app_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('apps/backend/requirements.txt') }}

      - name: Instalar dependências
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Ruff lint
        working-directory: apps/backend
        run: ruff check .

      - name: Ruff format check
        working-directory: apps/backend
        run: ruff format --check .

      - name: Migrations apply
        working-directory: apps/backend
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod
          DJANGO_SETTINGS_MODULE: config.settings
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: app_db_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          ACCESS_LOG_HMAC_KEY: ci-hmac-key-32bytes-not-for-prod!
        run: |
          python manage.py migrate
          python manage.py makemigrations --check

      - name: Testes
        working-directory: apps/backend
        env:
          SECRET_KEY: ci-secret-key-not-used-in-prod
          DJANGO_SETTINGS_MODULE: config.settings_ci
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: app_db_test
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          ACCESS_LOG_HMAC_KEY: ci-hmac-key-32bytes-not-for-prod!
        run: python -m pytest -v --tb=short

  # ─── Frontend ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.commits[0].modified, 'apps/frontend') ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Checar se frontend está inicializado (M1b+)
        id: check_frontend
        run: |
          if [ -f "apps/frontend/package.json" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "apps/frontend/package.json ainda não existe (M1a). Pulando steps de frontend."
          fi

      - uses: actions/setup-node@v4
        if: steps.check_frontend.outputs.initialized == 'true'
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar dependências
        if: steps.check_frontend.outputs.initialized == 'true'
        working-directory: apps/frontend
        run: npm ci

      - name: ESLint
        if: steps.check_frontend.outputs.initialized == 'true'
        working-directory: apps/frontend
        run: npm run lint

      - name: Vitest
        if: steps.check_frontend.outputs.initialized == 'true'
        working-directory: apps/frontend
        run: npm test

      - name: Build
        if: steps.check_frontend.outputs.initialized == 'true'
        working-directory: apps/frontend
        env:
          VITE_APP_NAME: App
        run: npm run build

  # ─── Feed service (Rust) ───────────────────────────────────────────────
  feed:
    name: Feed Service (Rust)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.commits[0].modified, 'services/feed') ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/feed/target
          key: cargo-${{ hashFiles('services/feed/Cargo.lock') }}

      - name: cargo fmt check
        working-directory: services/feed
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: services/feed
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: services/feed
        run: cargo test

      - name: cargo build (release)
        working-directory: services/feed
        run: cargo build --release

  # ─── E2E (job separado, roda só em push para main) ────────────────────
  e2e:
    name: E2E Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Checar se frontend está inicializado (M1b+)
        id: check_frontend
        run: |
          if [ -f "apps/frontend/package.json" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "apps/frontend/package.json ainda não existe (M1a). Pulando E2E."
          fi

      - name: Subir stack
        if: steps.check_frontend.outputs.initialized == 'true'
        run: |
          cp .env.example .env
          echo "SECRET_KEY=ci-e2e-secret" >> .env
          echo "POSTGRES_PASSWORD=e2e_pass" >> .env
          echo "REDIS_PASSWORD=e2e_redis" >> .env
          echo "APP_NAME=App" >> .env
          echo "VITE_APP_NAME=App" >> .env
          docker compose up -d --wait

      - uses: actions/setup-node@v4
        if: steps.check_frontend.outputs.initialized == 'true'
        with:
          node-version: "20"

      - name: Instalar Playwright
        if: steps.check_frontend.outputs.initialized == 'true'
        working-directory: apps/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Rodar E2E
        if: steps.check_frontend.outputs.initialized == 'true'
        working-directory: apps/frontend
        run: npx playwright test

      - name: Parar stack
        if: steps.check_frontend.outputs.initialized == 'true' && always()
        run: docker compose down -v

